  <style>
    :root {
      --navy: #1C385A;
      --sky: #1FA2E1;
      --gold: #FFCB42;
    }

    body {
      font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(160deg, #F5F7FB 0%, #EBF0F7 100%);
      color: #1C385A;
      min-height: 100vh;
    }

    /* SVG 通用变换基准设置 */
    #atomic-chick-svg * {
      transform-box: view-box;
    }

    .origin-center {
      transform-origin: 250px 250px;
    }

    .origin-chick {
      transform-origin: 250px 262px;
    }

    .origin-shell-top {
      transform-origin: 245px 185px;
    }

    .origin-tuft {
      transform-origin: 228px 160px;
    }

    .origin-wing-right {
      transform-origin: 300px 236px;
    }

    .origin-wing-left {
      transform-origin: 196px 248px;
    }

    .origin-eyes {
      transform-origin: 260px 221px;
    }

    /* 隐藏状态 */
    #atomic-chick-svg.state-hidden #chick-group,
    #atomic-chick-svg.state-hidden .orbit-piece,
    #atomic-chick-svg.state-hidden .electron-dot,
    #atomic-chick-svg.state-hidden .decor-item {
      opacity: 0;
      transform: scale(0);
    }

    /* ============================================================
       一、出场动画 (Entrance, 总时长约 1.1s)
       ============================================================ */
    /* 阶段 1 (0 ~ 0.55s): 小鸡主体 Q 弹弹出 */
    #atomic-chick-svg.state-enter #chick-group {
      opacity: 0;
      animation: chickEnter 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0s forwards;
    }

    /* 顶部蛋壳帽：略微延迟向上掀弹再落回 */
    #atomic-chick-svg.state-enter #shell-top {
      animation: shellTopHop 0.62s cubic-bezier(0.34, 1.56, 0.64, 1) 0.14s forwards;
    }

    /* 头顶呆毛抖动 */
    #atomic-chick-svg.state-enter #chick-tuft {
      animation: tuftWiggle 0.55s ease-out 0.22s forwards;
    }

    /* 右翅膀俏皮挥手打招呼 */
    #atomic-chick-svg.state-enter #wing-right {
      animation: wingWaveEnter 0.65s ease-in-out 0.25s forwards;
    }

    /* 阶段 2 (0.15 ~ 0.75s): 4 条原子轨道交错缩放旋转展开 */
    #atomic-chick-svg.state-enter .orbit-v {
      opacity: 0;
      animation: orbitEnterV 0.55s cubic-bezier(0.22, 1.28, 0.36, 1) 0.15s forwards;
    }
    #atomic-chick-svg.state-enter .orbit-h {
      opacity: 0;
      animation: orbitEnterH 0.55s cubic-bezier(0.22, 1.28, 0.36, 1) 0.22s forwards;
    }
    #atomic-chick-svg.state-enter .orbit-d1 {
      opacity: 0;
      animation: orbitEnterD1 0.55s cubic-bezier(0.22, 1.28, 0.36, 1) 0.28s forwards;
    }
    #atomic-chick-svg.state-enter .orbit-d2 {
      opacity: 0;
      animation: orbitEnterD2 0.55s cubic-bezier(0.22, 1.28, 0.36, 1) 0.34s forwards;
    }

    /* 2 颗电子球顺势弹入 */
    #atomic-chick-svg.state-enter #electron-1 {
      opacity: 0;
      transform-origin: 155px 196px;
      animation: popIn 0.38s cubic-bezier(0.34, 1.7, 0.64, 1) 0.46s forwards;
    }
    #atomic-chick-svg.state-enter #electron-2 {
      opacity: 0;
      transform-origin: 328px 353px;
      animation: popIn 0.38s cubic-bezier(0.34, 1.7, 0.64, 1) 0.54s forwards;
    }

    /* 阶段 3 (0.45 ~ 1.05s): 外圈星月与星点按 stagger 延迟依次弹出 */
    #atomic-chick-svg.state-enter .decor-pop {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: starPopEnter 0.44s cubic-bezier(0.34, 1.65, 0.64, 1) var(--d, 0.55s) forwards;
    }

    @keyframes chickEnter {
      0% {
        opacity: 0;
        transform: scale(0.2) translateY(28px);
      }
      60% {
        opacity: 1;
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes shellTopHop {
      0% { transform: translateY(0) rotate(0deg); }
      38% { transform: translateY(-16px) rotate(-7deg); }
      68% { transform: translateY(3px) rotate(2deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }

    @keyframes tuftWiggle {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(-16deg) scale(1.08); }
      55% { transform: rotate(12deg); }
      80% { transform: rotate(-6deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes wingWaveEnter {
      0% { transform: rotate(0deg); }
      25% { transform: rotate(-22deg); }
      50% { transform: rotate(8deg); }
      75% { transform: rotate(-16deg); }
      100% { transform: rotate(0deg); }
    }

    @keyframes orbitEnterV {
      0% { opacity: 0; transform: scale(0.25) rotate(-42deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes orbitEnterH {
      0% { opacity: 0; transform: scale(0.25) rotate(42deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes orbitEnterD1 {
      0% { opacity: 0; transform: scale(0.25) rotate(-38deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes orbitEnterD2 {
      0% { opacity: 0; transform: scale(0.25) rotate(38deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes starPopEnter {
      0% { opacity: 0; transform: scale(0) rotate(-35deg); }
      70% { opacity: 1; transform: scale(1.18) rotate(8deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }

    /* ============================================================
       二、待机微动效 (Idle, 出场结束后平滑切入)
       ============================================================ */
    #atomic-chick-svg.state-idle #chick-group {
      animation: chickFloat 3.4s ease-in-out infinite;
    }

    #atomic-chick-svg.state-idle #chick-eyes {
      animation: chickBlink 4.2s ease-in-out infinite;
    }

    #atomic-chick-svg.state-idle #wing-right {
      animation: wingIdle 2.8s ease-in-out infinite;
    }

    #atomic-chick-svg.state-idle #chick-tuft {
      animation: tuftIdle 3.4s ease-in-out infinite;
    }

    #atomic-chick-svg.state-idle .decor-twinkle {
      transform-box: fill-box;
      transform-origin: center;
      animation: twinkleBreath 3.2s ease-in-out var(--tw, 0s) infinite;
    }

    #atomic-chick-svg.state-idle #electron-1 {
      transform-origin: 155px 196px;
      animation: electronPulse 2.6s ease-in-out infinite;
    }
    #atomic-chick-svg.state-idle #electron-2 {
      transform-origin: 328px 353px;
      animation: electronPulse 2.6s ease-in-out 1.3s infinite;
    }

    #atomic-chick-svg.state-exit .decor-pop {
      transform-box: fill-box;
      transform-origin: center;
      animation: decorExit 0.35s cubic-bezier(0.55, 0.06, 0.68, 0.19) var(--ed, 0s) forwards;

    #atomic-chick-svg.state-exit .orbit-v {

    #atomic-chick-svg.state-exit .orbit-h {
      animation: orbitExitNeg 0.45s cubic-bezier(0.55, 0.05, 0.75, 0.2) 0.14s forwards;

    #atomic-chick-svg.state-exit .orbit-d1 {

    }
    #atomic-chick-svg.state-exit .orbit-d2 {
      animation: orbitExitNeg 0.45s cubic-bezier(0.55, 0.05, 0.75, 0.2) 0.22s forwards;
    }

    #atomic-chick-svg.state-exit #electron-1,
    #atomic-chick-svg.state-exit #electron-2 {
      transform-origin: 250px 250px;
      animation: orbitExitPos 0.42s cubic-bezier(0.55, 0.05, 0.75, 0.2) 0.12s forwards;
    }

    /* 阶段 3 (0.30 ~ 0.85s): 蛋壳帽扣紧 -> 小鸡压扁蓄力 -> 弹跳缩小消失 */
    #atomic-chick-svg.state-exit #shell-top {
      animation: shellTopClamp 0.3s ease-in-out 0.26s forwards;
    }

    #atomic-chick-svg.state-exit #chick-group {
      animation: chickExit 0.55s cubic-bezier(0.6, -0.28, 0.735, 0.045) 0.30s forwards;
    }

    @keyframes decorExit {
      0% { opacity: 1; transform: scale(1) rotate(0deg); }
      100% { opacity: 0; transform: scale(0.35) rotate(28deg); }
    }

    @keyframes orbitExitPos {
      0% { opacity: 1; transform: scale(1) rotate(0deg); }
      100% { opacity: 0; transform: scale(0.1) rotate(68deg); }
    }

    @keyframes orbitExitNeg {
      0% { opacity: 1; transform: scale(1) rotate(0deg); }
      100% { opacity: 0; transform: scale(0.1) rotate(-68deg); }
    }

    @keyframes shellTopClamp {

    @keyframes chickExit {

            <!-- 2 颗金黄色电子球（精准嵌在 45° 轨道前层中轴线上） -->
            <g id="electron-1" class="electron-dot">
              <circle cx="155" cy="196" r="8.5" fill="#FFC837" stroke="#1C385A" stroke-width="4.8" />
              <circle cx="152.5" cy="193.5" r="2.2" fill="#FFF3B0" />
            </g>
            <g id="electron-2" class="electron-dot">
              <circle cx="328" cy="353" r="8.5" fill="#FFC837" stroke="#1C385A" stroke-width="4.8" />
              <circle cx="325.5" cy="350.5" r="2.2" fill="#FFF3B0" />
            </g>
          </g>
        </svg>
      </div>

      <!-- 复制/下载轻量提示条 -->
      <div
        id="toast"
        class="pointer-events-none absolute bottom-4 left-1/2 -translate-x-1/2 translate-y-2 opacity-0 transition-all duration-300 px-4 py-2 rounded-full bg-[#1C385A] text-white text-xs font-medium shadow-lg flex items-center gap-2"
      >
        <svg class="w-4 h-4 text-[#FFCB42]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span id="toast-text">已复制到剪贴板</span>
      </div>
    </section>

    <!-- 底部交互控制栏 -->
    <footer class="px-5 py-5 bg-slate-50/90 border-t border-slate-100">
      <div class="flex flex-wrap items-center justify-center gap-2.5">
        <!-- 1. 播放出场动画 -->
        <button
          id="btn-enter"
          type="button"
          class="btn-control inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl text-sm font-semibold bg-[#1C385A] text-white hover:bg-[#264A75] shadow-sm cursor-pointer"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <span>播放出场动画</span>
        </button>

        <!-- 2. 播放退场动画 -->
        <button
          id="btn-exit"
          type="button"
          class="btn-control inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl text-sm font-semibold bg-white text-[#1C385A] border border-slate-200 hover:bg-slate-100 hover:border-slate-300 shadow-sm cursor-pointer"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>播放退场动画</span>
        </button>

        <!-- 3. 循环演示 -->
        <button
          id="btn-loop"
          type="button"
          aria-pressed="false"
          class="btn-control inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl text-sm font-semibold bg-white text-[#1C385A] border border-slate-200 hover:bg-slate-100 hover:border-slate-300 shadow-sm cursor-pointer"
        >
          <svg id="loop-icon" class="w-4 h-4 transition-transform duration-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"></polyline>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <polyline points="7 23 3 19 7 15"></polyline>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
          </svg>
          <span>循环演示</span>
        </button>

        <!-- 分隔符（大屏显示） -->
        <div class="hidden sm:block w-px h-6 bg-slate-200 mx-1"></div>

        <!-- 4. 下载 SVG -->
        <button
          id="btn-download"
          type="button"
          class="btn-control inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl text-sm font-semibold bg-sky-50 text-sky-700 border border-sky-200 hover:bg-sky-100 shadow-sm cursor-pointer"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>下载 SVG</span>
        </button>

        <!-- 5. 复制 SVG 代码 -->
        <button
          id="btn-copy"
          type="button"
          class="btn-control inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl text-sm font-semibold bg-amber-50 text-amber-800 border border-amber-200 hover:bg-amber-100 shadow-sm cursor-pointer"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          <span id="copy-btn-label">复制 SVG 代码</span>
        </button>
      </div>
    </footer>
  </main>

  <script>
    (function () {
      const svgEl = document.getElementById('atomic-chick-svg');
      const statusBadge = document.getElementById('status-badge');
      const statusDot = document.getElementById('status-dot');
      const statusText = document.getElementById('status-text');

      const btnEnter = document.getElementById('btn-enter');
      const btnExit = document.getElementById('btn-exit');
      const btnLoop = document.getElementById('btn-loop');
      const loopIcon = document.getElementById('loop-icon');
      const btnDownload = document.getElementById('btn-download');
      const btnCopy = document.getElementById('btn-copy');
      const copyBtnLabel = document.getElementById('copy-btn-label');

      const toast = document.getElementById('toast');
      const toastText = document.getElementById('toast-text');

      // 动画时长常量（毫秒）
      const ENTER_DURATION = 1120;
      const EXIT_DURATION = 880;
      const LOOP_IDLE_HOLD = 2500;
      const LOOP_HIDDEN_PAUSE = 800;

      // 状态机变量
      let currentState = 'hidden'; // 'entering' | 'idle' | 'exiting' | 'hidden'
      let isLooping = false;
      let timers = [];
      let toastTimer = null;

      /**
       * 清理所有待执行定时器，防止状态切换冲突
       */
      function clearAllTimers() {
        timers.forEach((id) => clearTimeout(id));
        timers = [];
      }

      /**
       * 注册受控定时器
       */
      function schedule(fn, delay) {
        const id = setTimeout(() => {
          timers = timers.filter((t) => t !== id);
          fn();
        }, delay);
        timers.push(id);
        return id;
      }

      /**
       * 更新顶部状态徽章样式与文案
       */
      function updateStatusUI(state) {
        currentState = state;
        const map = {
          entering: {
            text: '出场动画中',
            badge: 'bg-sky-50 text-sky-700 border-sky-200/80',
            dot: 'bg-sky-500 animate-pulse',
          },
          idle: {
            text: '待机微动效',
            badge: 'bg-emerald-50 text-emerald-700 border-emerald-200/80',
            dot: 'bg-emerald-500',
          },
          exiting: {
            text: '退场动画中',
            badge: 'bg-amber-50 text-amber-700 border-amber-200/80',
            dot: 'bg-amber-500 animate-pulse',
          },
          hidden: {
            text: '已退场隐藏',
            badge: 'bg-slate-100 text-slate-600 border-slate-200',
            dot: 'bg-slate-400',
          },
        };
        const cfg = map[state] || map.hidden;
        statusBadge.className = `inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium border ${cfg.badge}`;
        statusDot.className = `w-2 h-2 rounded-full ${cfg.dot}`;
        statusText.textContent = isLooping ? `${cfg.text} · 循环` : cfg.text;
      }

      /**
       * 切换 SVG 动画类并强制触发重绘以重播 CSS Keyframes
       */
      function applySvgStateClass(className) {
        svgEl.classList.remove('state-enter', 'state-idle', 'state-exit', 'state-hidden');
        void svgEl.offsetWidth; // 强制同步 reflow，确保动画从第 0 帧干净重播
        svgEl.classList.add(className);
      }

      /**
       * 播放出场动画 -> 自动进入待机
       */
      function playEntrance() {
        clearAllTimers();
        applySvgStateClass('state-enter');
        updateStatusUI('entering');

        schedule(() => {
          applySvgStateClass('state-idle');
          updateStatusUI('idle');

          if (isLooping) {
            schedule(() => {
              playExit();
            }, LOOP_IDLE_HOLD);
          }
        }, ENTER_DURATION);
      }

      /**
       * 从当前状态平滑触发退场动画
       */
      function playExit() {
        if (currentState === 'hidden' && !isLooping) {
          showToast('当前已处于退场隐藏状态');
          return;
        }
        clearAllTimers();
        applySvgStateClass('state-exit');
        updateStatusUI('exiting');

        schedule(() => {
          applySvgStateClass('state-hidden');
          updateStatusUI('hidden');

          if (isLooping) {
            schedule(() => {
              playEntrance();
            }, LOOP_HIDDEN_PAUSE);
          }
        }, EXIT_DURATION);
      }

      /**
       * 切换循环演示模式
       */
      function toggleLoop() {
        isLooping = !isLooping;
        btnLoop.setAttribute('aria-pressed', String(isLooping));

        if (isLooping) {
          btnLoop.className =
            'btn-control inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl text-sm font-semibold bg-[#1FA2E1] text-white border border-[#1FA2E1] shadow-md shadow-sky-200 cursor-pointer';
          loopIcon.classList.add('animate-spin');
          loopIcon.style.animationDuration = '3s';
          playEntrance();
        } else {
          btnLoop.className =
            'btn-control inline-flex items-center gap-1.5 px-4 py-2.5 rounded-xl text-sm font-semibold bg-white text-[#1C385A] border border-slate-200 hover:bg-slate-100 hover:border-slate-300 shadow-sm cursor-pointer';
          loopIcon.classList.remove('animate-spin');
          clearAllTimers();
          // 停止循环时：若正在播放出场或退场，让当前阶段自然完成；若已停留在某状态则更新文案
          if (currentState === 'entering') {
            schedule(() => {
              applySvgStateClass('state-idle');
              updateStatusUI('idle');
            }, 600);
          } else if (currentState === 'exiting') {
            schedule(() => {
              applySvgStateClass('state-hidden');
              updateStatusUI('hidden');
            }, 500);
          } else {
            updateStatusUI(currentState);
          }
        }
      }

      /**
       * 生成纯净独立的 SVG 源代码（去除网页动效类与临时内联延迟变量）
       */
      function getCleanSvgString() {
        const clone = svgEl.cloneNode(true);
        clone.removeAttribute('id');
        clone.removeAttribute('class');
        clone.removeAttribute('role');
        clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        clone.setAttribute('width', '500');
        clone.setAttribute('height', '500');

        // 清理仅用于 HTML 动效的 class 和 style 自定义变量
        const allNodes = clone.querySelectorAll('*');
        allNodes.forEach((node) => {
          node.removeAttribute('class');
          node.removeAttribute('style');
        });

        const serializer = new XMLSerializer();
        const raw = serializer.serializeToString(clone);
        return `<?xml version="1.0" encoding="UTF-8"?>\n${raw}`;
      }

      /**
       * 下载纯净 SVG 文件 (atomic-chick.svg)
       */
      function downloadSvg() {
        try {
          const svgCode = getCleanSvgString();
          const blob = new Blob([svgCode], { type: 'image/svg+xml;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = 'atomic-chick.svg';
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          showToast('已开始下载 atomic-chick.svg');
        } catch (err) {
          showToast('下载失败，请重试');
        }
      }

      /**
       * 一键复制纯净 SVG 源码
       */
      function copySvgCode() {
        try {
          const svgCode = getCleanSvgString();
          const textarea = document.createElement('textarea');
          textarea.value = svgCode;
          textarea.setAttribute('readonly', '');
          textarea.style.position = 'fixed';
          textarea.style.left = '-9999px';
          textarea.style.top = '0';
          document.body.appendChild(textarea);
          textarea.select();
          textarea.setSelectionRange(0, svgCode.length);
          const ok = document.execCommand('copy');
          document.body.removeChild(textarea);

          if (ok) {
            copyBtnLabel.textContent = '已复制';
            showToast('纯净 SVG 代码已复制');
            setTimeout(() => {
              copyBtnLabel.textContent = '复制 SVG 代码';
            }, 1800);
          } else {
            showToast('复制未成功，请手动下载 SVG');
          }
        } catch (err) {
          showToast('复制失败，请使用下载功能');
        }
      }

      /**
       * 显示底部轻量提示条
       */
      function showToast(message) {
        toastText.textContent = message;
        toast.classList.remove('opacity-0', 'translate-y-2');
        toast.classList.add('opacity-100', 'translate-y-0');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast.classList.remove('opacity-100', 'translate-y-0');
          toast.classList.add('opacity-0', 'translate-y-2');
        }, 2000);
      }

      // 绑定按钮事件
      btnEnter.addEventListener('click', () => {
        if (isLooping) toggleLoop();
        playEntrance();
      });

      btnExit.addEventListener('click', () => {
        if (isLooping) toggleLoop();
        playExit();
      });

      btnLoop.addEventListener('click', toggleLoop);
      btnDownload.addEventListener('click', downloadSvg);
      btnCopy.addEventListener('click', copySvgCode);

      // 页面初次加载自动播放一次出场动画
      window.addEventListener('DOMContentLoaded', () => {
        playEntrance();
      });
    })();
  </script>
  <script>
    (function () {
      if (!new URLSearchParams(location.search).has('embed')) return;
      document.body.classList.add('embed');
      function start() {
        var play = document.getElementById('btn-enter');
        if (play) play.click();
      }
      if (document.readyState === 'complete') start();
      else window.addEventListener('load', start);
    })();
  </script>
</body>
